# host tests of the portable core: plain c99, no uikit and no ios toolchain, see tools/meow
# the recorded pages are single string literals past the 4095 byte minimum c99 obliges a compiler
# to accept, so only the programs that include a fixture silence that note

[test.pk_media_drag]
src = ["tests/test_pk_media_drag.c", "core/pk_media_drag.c"]
cflags = ["-std=c99", "-Wall", "-Wextra", "-Wpedantic", "-O2", "-Icore"]
libs = ["m"]

[test.pk_photo_zoom]
src = ["tests/test_pk_photo_zoom.c", "core/pk_photo_zoom.c"]
cflags = ["-std=c99", "-Wall", "-Wextra", "-Wpedantic", "-O2", "-Icore"]
libs = ["m"]

