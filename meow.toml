# there is no rootless jailbreak before ios 15, so the payload is the classic one: the bundle under
# /Applications and nothing else
[deb.deb]
output = "weeabu-v${field:packaging/DEBIAN/control:Version}.deb"
control = "packaging/DEBIAN/control"
scripts = { postinst = "packaging/DEBIAN/postinst", postrm = "packaging/DEBIAN/postrm" }
